scenarios:
  - name: "RMA Customer Account - Create with accounting fields"
    steps:
      - step: "Create inbound stock route"
        action: "create"
        model: "stock.location.route"
        save_as: "inbound_route"
        values:
          name: "Test RMA Account Inbound Route"

      - step: "Create outbound stock route"
        action: "create"
        model: "stock.location.route"
        save_as: "outbound_route"
        values:
          name: "Test RMA Account Outbound Route"

      - step: "Get main warehouse"
        action: "ref"
        xml_id: "stock.warehouse0"
        save_as: "warehouse"

      - step: "Get stock location"
        action: "ref"
        xml_id: "stock.stock_location_stock"
        save_as: "stock_location"

      - step: "Get no-policy ref"
        action: "ref"
        xml_id: "ssi_rma.rma_policy_no"
        save_as: "policy_no"

      - step: "Create RMA route template"
        action: "create"
        model: "rma_route_template"
        save_as: "route_template"
        values:
          name: "Test Account Route Template"
          code: "TARM001"
          inbound_route_id: "EVAL: registry['inbound_route'].id"
          outbound_route_id: "EVAL: registry['outbound_route'].id"
          inbound_warehouse_id: "EVAL: registry['warehouse'].id"
          outbound_warehouse_id: "EVAL: registry['warehouse'].id"
          location_id: "EVAL: registry['stock_location'].id"

      - step: "Create RMA customer operation"
        action: "create"
        model: "rma_operation"
        save_as: "operation"
        values:
          name: "Test Account Operation"
          code: "TACO001"
          direction: "customer"
          receipt_policy_id: "EVAL: registry['policy_no'].id"
          delivery_policy_id: "EVAL: registry['policy_no'].id"
          rma_supplier_policy_id: "EVAL: registry['policy_no'].id"

      - step: "Create RMA reason"
        action: "create"
        model: "rma_reason"
        save_as: "reason"
        values:
          name: "Test Account Reason"
          code: "TAR001"

      - step: "Create partner"
        action: "create"
        model: "res.partner"
        save_as: "partner"
        values:
          name: "Test RMA Account Partner"

      - step: "Create RMA customer with accounting fields"
        action: "create"
        model: "rma_customer"
        save_as: "rma_customer"
        as_user: "base.user_admin"
        values:
          partner_id: "EVAL: registry['partner'].id"
          reason_id: "EVAL: registry['reason'].id"
          operation_id: "EVAL: registry['operation'].id"
          route_template_id: "EVAL: registry['route_template'].id"
          date_due: 2030-12-31

      - step: "Assert RMA created with accounting fields available"
        action: "assert"
        target: "rma_customer"
        asserts:
          state:
            type: "value"
            expected: "draft"
          qty_to_refund:
            type: "value"
            expected: 0.0
          qty_refund:
            type: "value"
            expected: 0.0
          need_refund:
            type: "value"
            expected: false
          refund_complete:
            type: "value"
            expected: false

      - step: "Confirm RMA customer"
        action: "call"
        target: "rma_customer"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Invalidate cache"
        action: "call"
        target: "rma_customer"
        method: "invalidate_cache"

      - step: "Approve RMA customer"
        action: "call"
        target: "rma_customer"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"
