scenarios:
  - name: "RMA Customer - Full workflow draft to open then reject"
    steps:
      - step: "Create inbound stock route"
        action: "create"
        model: "stock.location.route"
        save_as: "inbound_route"
        values:
          name: "Test RMA Customer Inbound Route"

      - step: "Create outbound stock route"
        action: "create"
        model: "stock.location.route"
        save_as: "outbound_route"
        values:
          name: "Test RMA Customer Outbound Route"

      - step: "Get main warehouse"
        action: "ref"
        xml_id: "stock.warehouse0"
        save_as: "warehouse"

      - step: "Get stock location"
        action: "ref"
        xml_id: "stock.stock_location_stock"
        save_as: "stock_location"

      - step: "Get no-policy ref"
        action: "ref"
        xml_id: "ssi_rma.rma_policy_no"
        save_as: "policy_no"

      - step: "Create RMA route template"
        action: "create"
        model: "rma_route_template"
        save_as: "route_template"
        values:
          name: "Test Customer Route Template"
          code: "TCRM001"
          inbound_route_id: "EVAL: registry['inbound_route'].id"
          outbound_route_id: "EVAL: registry['outbound_route'].id"
          inbound_warehouse_id: "EVAL: registry['warehouse'].id"
          outbound_warehouse_id: "EVAL: registry['warehouse'].id"
          location_id: "EVAL: registry['stock_location'].id"

      - step: "Create RMA customer operation"
        action: "create"
        model: "rma_operation"
        save_as: "operation"
        values:
          name: "Test Customer Operation WF"
          code: "TCOWF001"
          direction: "customer"
          receipt_policy_id: "EVAL: registry['policy_no'].id"
          delivery_policy_id: "EVAL: registry['policy_no'].id"
          rma_supplier_policy_id: "EVAL: registry['policy_no'].id"
          default_route_template_id: "EVAL: registry['route_template'].id"
          allowed_route_template_ids:
            - "EVAL: registry['route_template'].id"

      - step: "Create RMA reason"
        action: "create"
        model: "rma_reason"
        save_as: "reason"
        values:
          name: "Test Customer Reason"
          code: "TCR001"

      - step: "Create partner"
        action: "create"
        model: "res.partner"
        save_as: "partner"
        values:
          name: "Test RMA Customer Partner"

      - step: "Create product"
        action: "create"
        model: "product.product"
        save_as: "product"
        values:
          name: "Test RMA Product"
          type: "product"

      - step: "Get unit of measure"
        action: "ref"
        xml_id: "uom.product_uom_unit"
        save_as: "uom"

      - step: "Create RMA customer in draft"
        action: "create"
        model: "rma_customer"
        save_as: "rma_customer"
        as_user: "base.user_admin"
        values:
          partner_id: "EVAL: registry['partner'].id"
          reason_id: "EVAL: registry['reason'].id"
          operation_id: "EVAL: registry['operation'].id"
          route_template_id: "EVAL: registry['route_template'].id"
          date_due: 2030-12-31

      - step: "Assert RMA customer created in draft"
        action: "assert"
        target: "rma_customer"
        asserts:
          state:
            type: "value"
            expected: "draft"
          id:
            type: "value"
            operator: "is_truthy"

      - step: "Add line to RMA customer"
        action: "create"
        model: "rma_customer_line"
        save_as: "rma_line"
        values:
          order_id: "EVAL: registry['rma_customer'].id"
          product_id: "EVAL: registry['product'].id"
          uom_id: "EVAL: registry['uom'].id"
          uom_quantity: 5.0
          name: "Test Product Description"

      - step: "Assert line created"
        action: "assert"
        target: "rma_line"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          uom_quantity:
            type: "value"
            expected: 5.0

      - step: "Confirm RMA customer"
        action: "call"
        target: "rma_customer"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Invalidate cache after confirm"
        action: "call"
        target: "rma_customer"
        method: "invalidate_cache"

      - step: "Reject approval"
        action: "call"
        target: "rma_customer"
        method: "action_reject_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "reject"

  - name: "RMA Customer - Create with no lines and check computed fields"
    steps:
      - step: "Create inbound stock route"
        action: "create"
        model: "stock.location.route"
        save_as: "inbound_route"
        values:
          name: "Test RMA Computed Inbound Route"

      - step: "Create outbound stock route"
        action: "create"
        model: "stock.location.route"
        save_as: "outbound_route"
        values:
          name: "Test RMA Computed Outbound Route"

      - step: "Get main warehouse"
        action: "ref"
        xml_id: "stock.warehouse0"
        save_as: "warehouse"

      - step: "Get stock location"
        action: "ref"
        xml_id: "stock.stock_location_stock"
        save_as: "stock_location"

      - step: "Get no-policy ref"
        action: "ref"
        xml_id: "ssi_rma.rma_policy_no"
        save_as: "policy_no"

      - step: "Create RMA route template"
        action: "create"
        model: "rma_route_template"
        save_as: "route_template"
        values:
          name: "Test Computed Route Template"
          code: "TCRM002"
          inbound_route_id: "EVAL: registry['inbound_route'].id"
          outbound_route_id: "EVAL: registry['outbound_route'].id"
          inbound_warehouse_id: "EVAL: registry['warehouse'].id"
          outbound_warehouse_id: "EVAL: registry['warehouse'].id"
          location_id: "EVAL: registry['stock_location'].id"

      - step: "Create RMA customer operation"
        action: "create"
        model: "rma_operation"
        save_as: "operation"
        values:
          name: "Test Computed Customer Op"
          code: "TCCO002"
          direction: "customer"
          receipt_policy_id: "EVAL: registry['policy_no'].id"
          delivery_policy_id: "EVAL: registry['policy_no'].id"
          rma_supplier_policy_id: "EVAL: registry['policy_no'].id"

      - step: "Create RMA reason"
        action: "create"
        model: "rma_reason"
        save_as: "reason"
        values:
          name: "Test Computed Reason"
          code: "TCR002"

      - step: "Create partner"
        action: "create"
        model: "res.partner"
        save_as: "partner"
        values:
          name: "Test Computed Partner"

      - step: "Create RMA customer"
        action: "create"
        model: "rma_customer"
        save_as: "rma_customer"
        as_user: "base.user_admin"
        values:
          partner_id: "EVAL: registry['partner'].id"
          reason_id: "EVAL: registry['reason'].id"
          operation_id: "EVAL: registry['operation'].id"
          route_template_id: "EVAL: registry['route_template'].id"
          date_due: 2030-12-31

      - step: "Assert computed fields on empty RMA"
        action: "assert"
        target: "rma_customer"
        asserts:
          state:
            type: "value"
            expected: "draft"
          uom_quantity:
            type: "value"
            expected: 0.0
          qty_received:
            type: "value"
            expected: 0.0
          qty_delivered:
            type: "value"
            expected: 0.0
          num_of_reception:
            type: "value"
            expected: 0
          num_of_delivery:
            type: "value"
            expected: 0
