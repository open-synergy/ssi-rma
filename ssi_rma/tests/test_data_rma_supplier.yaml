scenarios:
  - name: "RMA Supplier - Full workflow draft to open"
    steps:
      - step: "Create inbound stock route"
        action: "create"
        model: "stock.location.route"
        save_as: "inbound_route"
        values:
          name: "Test RMA Supplier Inbound Route"

      - step: "Create outbound stock route"
        action: "create"
        model: "stock.location.route"
        save_as: "outbound_route"
        values:
          name: "Test RMA Supplier Outbound Route"

      - step: "Get main warehouse"
        action: "ref"
        xml_id: "stock.warehouse0"
        save_as: "warehouse"

      - step: "Get stock location"
        action: "ref"
        xml_id: "stock.stock_location_stock"
        save_as: "stock_location"

      - step: "Get no-policy ref"
        action: "ref"
        xml_id: "ssi_rma.rma_policy_no"
        save_as: "policy_no"

      - step: "Create RMA route template"
        action: "create"
        model: "rma_route_template"
        save_as: "route_template"
        values:
          name: "Test Supplier Route Template"
          code: "TSRM001"
          inbound_route_id: "EVAL: registry['inbound_route'].id"
          outbound_route_id: "EVAL: registry['outbound_route'].id"
          inbound_warehouse_id: "EVAL: registry['warehouse'].id"
          outbound_warehouse_id: "EVAL: registry['warehouse'].id"
          location_id: "EVAL: registry['stock_location'].id"

      - step: "Create RMA supplier operation"
        action: "create"
        model: "rma_operation"
        save_as: "operation"
        values:
          name: "Test Supplier Operation WF"
          code: "TSOWF001"
          direction: "supplier"
          receipt_policy_id: "EVAL: registry['policy_no'].id"
          delivery_policy_id: "EVAL: registry['policy_no'].id"
          rma_supplier_policy_id: "EVAL: registry['policy_no'].id"
          default_route_template_id: "EVAL: registry['route_template'].id"
          allowed_route_template_ids:
            - "EVAL: registry['route_template'].id"

      - step: "Create RMA reason"
        action: "create"
        model: "rma_reason"
        save_as: "reason"
        values:
          name: "Test Supplier Reason"
          code: "TSR001"

      - step: "Create partner"
        action: "create"
        model: "res.partner"
        save_as: "partner"
        values:
          name: "Test RMA Supplier Partner"

      - step: "Create product"
        action: "create"
        model: "product.product"
        save_as: "product"
        values:
          name: "Test RMA Supplier Product"
          type: "product"

      - step: "Get unit of measure"
        action: "ref"
        xml_id: "uom.product_uom_unit"
        save_as: "uom"

      - step: "Create RMA supplier in draft"
        action: "create"
        model: "rma_supplier"
        save_as: "rma_supplier"
        as_user: "base.user_admin"
        values:
          partner_id: "EVAL: registry['partner'].id"
          reason_id: "EVAL: registry['reason'].id"
          operation_id: "EVAL: registry['operation'].id"
          route_template_id: "EVAL: registry['route_template'].id"
          date_due: 2030-12-31

      - step: "Assert RMA supplier created in draft"
        action: "assert"
        target: "rma_supplier"
        asserts:
          state:
            type: "value"
            expected: "draft"
          id:
            type: "value"
            operator: "is_truthy"

      - step: "Add line to RMA supplier"
        action: "create"
        model: "rma_supplier_line"
        save_as: "rma_line"
        values:
          order_id: "EVAL: registry['rma_supplier'].id"
          product_id: "EVAL: registry['product'].id"
          uom_id: "EVAL: registry['uom'].id"
          uom_quantity: 3.0
          name: "Test Product Description"

      - step: "Assert line created"
        action: "assert"
        target: "rma_line"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          uom_quantity:
            type: "value"
            expected: 3.0

      - step: "Confirm RMA supplier"
        action: "call"
        target: "rma_supplier"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Invalidate cache after confirm"
        action: "call"
        target: "rma_supplier"
        method: "invalidate_cache"

      - step: "Approve RMA supplier"
        action: "call"
        target: "rma_supplier"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Invalidate cache after open"
        action: "call"
        target: "rma_supplier"
        method: "invalidate_cache"

      - step: "Assert RMA supplier open state fields"
        action: "assert"
        target: "rma_supplier"
        asserts:
          need_reception:
            type: "value"
            expected: false
          need_delivery:
            type: "value"
            expected: false
          uom_quantity:
            type: "value"
            expected: 3.0
